version: '3.9'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_AVAILABLE=false
      - REDIS_AVAILABLE=false
      - DERIV_ACTIVE_SYMBOLS=R_10,R_25,R_50,R_75,R_100

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
    depends_on:
      - backend
