[tool.poetry]
name = "eaglex-backend"
version = "1.0.0"
description = "EAGLE-X Trading Intelligence Platform - Backend"
authors = ["EAGLE-X Engineering"]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.24.0"}
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
websockets = "^12.0"
python-dotenv = "^1.0.0"
httpx = "^0.25.0"
tenacity = "^8.2.3"
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-asyncio = "^0.21.1"
pytest-cov = "^4.1.0"
hypothesis = "^6.88.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
