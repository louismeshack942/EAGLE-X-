services:
  - type: web
    name: eaglex-backend
    env: docker
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DERIV_WS_URL
        value: wss://ws.derivws.com/websockets/v3
      - key: DERIV_APP_ID
        value: 1089
      - key: DERIV_API_TOKEN
        sync: false
      - key: DERIV_ACTIVE_SYMBOLS
        value: R_10,R_25,R_50,R_75,R_100
      - key: SECRET_KEY
        generateValue: true
    healthCheckPath: /health

  - type: web
    name: eaglex-frontend
    env: docker
    region: frankfurt
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    envVars:
      # Runtime proxy target (read at request time by /api/proxy)
      # NOTE: backend-38co is the live EAGLE-X backend service;
      # "eaglex-backend.onrender.com" belongs to the legacy eagle-ai project.
      - key: BACKEND_URL
        value: https://backend-38co.onrender.com
      # Client-side fallback (build-time)
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://backend-38co.onrender.com
